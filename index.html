<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- API Key Setup -->
        <div id="api-key-setup">
            <div class="container">
                <h1>Gemini API Key</h1>
                <p>請輸入您的 Gemini API 金鑰以開始聊天。</p>
                <div class="input-group">
                    <input type="password" id="api-key-input" placeholder="在此輸入您的 API 金鑰">
                    <button id="save-api-key">儲存</button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="hidden">
            <!-- Sidebar -->
            <div id="sidebar">
                <button id="new-chat-button">+ 新對話</button>
                <div id="conversation-history-list">
                    <!-- Conversation history will be appended here -->
                </div>
            </div>

            <!-- Chat Interface -->
            <div id="chat-interface">
                <div id="chat-header">
                    <select id="mask-select"></select>
                    <button id="add-mask-button">＋</button>
                </div>
                <div class="chat-container">
                    <div id="chat-history">
                        <!-- Messages will be appended here -->
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" id="message-input" placeholder="輸入訊息...">
                    <button id="send-button">傳送</button>
                </div>
                <div id="suggested-questions">
                    <!-- Suggested questions will be appended here -->
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="script.js"></script>
</body>
</html>
